[package]
name = "second_brain"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
hex = "0.4.3"
ignore = "0.4.30"
rayon = "1.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11.0"
streaming-iterator = "0.1"
thiserror = "2.0.18"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile = "3.27.0"
