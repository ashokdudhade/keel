name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: keel
      - name: Test
        run: cargo test
      - name: Build release binary
        run: cargo build --release

  mcp-trust-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keel
      - name: Build + index
        run: |
          cargo build --release --manifest-path keel/Cargo.toml
          ./keel/target/release/keel index .
      - name: Agent trust MCP smoke
        env:
          KEEL_BIN: ${{ github.workspace }}/keel/target/release/keel
        run: python3 scripts/mcp-trust-smoke.py
