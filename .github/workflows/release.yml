name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        working-directory: keel
        run: cargo test
      - name: Clippy
        working-directory: keel
        run: cargo clippy --all-targets -- -D warnings
      - name: Installer syntax
        run: sh -n install.sh && bash scripts/test-install.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release archive
        working-directory: keel
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --target "${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/keel"
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/keel"
          cp ../README.md "$STAGE/README.md"
          cp CHANGELOG.md "$STAGE/CHANGELOG.md"
          tar -C "$STAGE" -czf "../keel-${VERSION}-${{ matrix.target }}.tar.gz" keel README.md CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.target }}
          path: keel-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS and patch Homebrew formula
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          cd dist
          sha256sum keel-*.tar.gz | tee SHA256SUMS
          cd ..
          export VERSION
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ["VERSION"]
          sums = {}
          for line in Path("dist/SHA256SUMS").read_text().splitlines():
              h, name = line.split()
              sums[name] = h
          text = Path("Formula/keel.rb").read_text()
          text = re.sub(r'version "[^"]*"', f'version "{version}"', text, count=1)
          mapping = {
              "REPLACE_WITH_RELEASE_SHA256_AARCH64_APPLE_DARWIN": f"keel-{version}-aarch64-apple-darwin.tar.gz",
              "REPLACE_WITH_RELEASE_SHA256_X86_64_APPLE_DARWIN": f"keel-{version}-x86_64-apple-darwin.tar.gz",
              "REPLACE_WITH_RELEASE_SHA256_AARCH64_UNKNOWN_LINUX_GNU": f"keel-{version}-aarch64-unknown-linux-gnu.tar.gz",
              "REPLACE_WITH_RELEASE_SHA256_X86_64_UNKNOWN_LINUX_GNU": f"keel-{version}-x86_64-unknown-linux-gnu.tar.gz",
          }
          for marker, archive in mapping.items():
              text = text.replace(marker, sums[archive])
          Path("Formula/keel.rb").write_text(text)
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
      - name: Commit updated Homebrew formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keel.rb
          if git diff --staged --quiet; then
            echo "No formula changes"
          else
            git commit -m "chore(release): update Homebrew formula checksums for ${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
            git push origin HEAD:main || true
          fi
