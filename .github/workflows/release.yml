name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        working-directory: keel
        run: cargo test
      - name: Clippy
        working-directory: keel
        run: cargo clippy --all-targets -- -D warnings
      - name: Installer syntax
        run: sh -n install.sh && bash scripts/test-install.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Cross-compile Intel macOS on Apple Silicon runners (macos-13 is often
          # queued for a long time on GitHub-hosted runners).
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release archive
        working-directory: keel
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cargo build --release --target "${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/keel"
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/keel"
          cp ../README.md "$STAGE/README.md"
          cp CHANGELOG.md "$STAGE/CHANGELOG.md"
          tar -C "$STAGE" -czf "../keel-${VERSION}-${{ matrix.target }}.tar.gz" keel README.md CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: keel-${{ matrix.target }}
          path: keel-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Need a branch we can push formula checksums back to.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS and patch Homebrew formula
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cd dist
          sha256sum keel-*.tar.gz | tee SHA256SUMS
          cd ..
          export VERSION
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ["VERSION"]
          sums = {}
          for line in Path("dist/SHA256SUMS").read_text().splitlines():
              h, name = line.split()
              sums[name] = h
          required = [
              f"keel-{version}-aarch64-apple-darwin.tar.gz",
              f"keel-{version}-x86_64-apple-darwin.tar.gz",
              f"keel-{version}-aarch64-unknown-linux-gnu.tar.gz",
              f"keel-{version}-x86_64-unknown-linux-gnu.tar.gz",
          ]
          missing = [a for a in required if a not in sums]
          if missing:
              raise SystemExit(f"missing archives: {missing}; have {sorted(sums)}")
          text = Path("Formula/keel.rb").read_text()
          text = re.sub(r'version "[^"]*"', f'version "{version}"', text, count=1)
          for archive, digest in ((a, sums[a]) for a in required):
              arch = archive.removeprefix(f"keel-{version}-").removesuffix(".tar.gz")
              pattern = rf'(keel-#\{{version\}}-{re.escape(arch)}\.tar\.gz"\n\s*sha256 ")[^"]+(")'
              text, n = re.subn(pattern, rf"\g<1>{digest}\2", text, count=1)
              if n != 1:
                  raise SystemExit(f"failed to patch sha256 for {archive} (matches={n})")
          Path("Formula/keel.rb").write_text(text)
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Commit updated Homebrew formula to main
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve patched formula + checksums across branch switch.
          cp Formula/keel.rb /tmp/keel.rb.patched
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/keel.rb.patched Formula/keel.rb
          git add Formula/keel.rb
          if git diff --staged --quiet; then
            echo "No formula changes"
          else
            git commit -m "chore(release): update Homebrew formula checksums for ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
