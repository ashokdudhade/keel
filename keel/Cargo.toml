[package]
name = "keel"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
hex = "0.4.3"
ignore = "0.4.30"
notify = "6"
rayon = "1.12.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
streaming-iterator = "0.1"
thiserror = "2.0.18"
tiny_http = "0.12.0"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.27.0"
